name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.19.7"

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      # Swatinem/rust-cache v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo +stable fmt --all -- --check
      - name: Lint default features
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint all features
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test default features
        run: cargo +stable test --workspace --locked
      - name: Test all features
        run: cargo +stable test --workspace --all-features --locked
      - name: Test release fail-closed quota invariant
        run: >-
          cargo +stable test
          -p runlimit-memory
          --release
          --locked
          corrupt_quota_state_fails_closed_in_release_builds
      - name: Format external consumer
        run: >-
          cargo +stable fmt
          --manifest-path smoke/external-consumer/Cargo.toml
          -- --check
      - name: Lint external consumer
        run: >-
          cargo +stable clippy
          --manifest-path smoke/external-consumer/Cargo.toml
          --all-targets
          --locked
          --target-dir target/external-consumer
          -- -D warnings

  package:
    name: Packaged archive smoke
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.88.0 --profile minimal
      # Swatinem/rust-cache v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Test packaged crates as an external consumer
        run: ./scripts/run-external-consumer-smoke.sh

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      # Swatinem/rust-cache v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Check default features
        run: cargo +1.88.0 check --workspace --all-targets --locked
      - name: Check all features
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked
      - name: Check external consumer
        run: >-
          cargo +1.88.0 check
          --manifest-path smoke/external-consumer/Cargo.toml
          --locked
          --target-dir target/external-consumer

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runlimit
          POSTGRES_PASSWORD: runlimit
          POSTGRES_DB: runlimit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runlimit -d runlimit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      RUNLIMIT_POSTGRES_TEST_DATABASE_URL: postgresql://runlimit:runlimit@127.0.0.1:5432/runlimit
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      # Swatinem/rust-cache v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Run PostgreSQL integration tests (default features)
        run: >-
          cargo +stable test
          -p runlimit-postgres
          --test postgres
          --locked
          --
          --ignored
          --test-threads=1
      - name: Run PostgreSQL integration tests (all features)
        run: >-
          cargo +stable test
          -p runlimit-postgres
          --test postgres
          --all-features
          --locked
          --
          --ignored
          --test-threads=1

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny check
